<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Supply Chain Disruption Monitor</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>(function(){var t=null;try{t=localStorage.getItem('theme')}catch(e){}
if(!t)t=(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';
document.documentElement.setAttribute('data-theme',t)})()</script>
<style>
:root{
 color-scheme:dark;--w:255,255,255;
 --t-red:#fca5a5;--t-grn:#6ee7b7;--t-blu:#93c5fd;--t-amb:#fbbf24;--t-amb2:#fcd34d;--t-pu:#a78bfa;--t-cy:#22d3ee;--t-blu2:#60a5fa;
 --hdr-bg:rgba(15,23,42,.72);--hdr-bg2:rgba(15,23,42,.95);
 --canvas:#0b1120;--surface:#111827;--s2:#1a2332;--s3:#1f2d3d;
 --glass:rgba(var(--w),.06);--gb:rgba(var(--w),.08);--gh:rgba(var(--w),.1);
 --tx:#f1f5f9;--tx2:#94a3b8;--tx3:#64748b;
 --ac:#3b82f6;--ac-g:rgba(59,130,246,.25);--ac-d:#2563eb;
 --red:#ef4444;--rd:rgba(239,68,68,.12);--rg:rgba(239,68,68,.25);
 --amb:#f59e0b;--ad:rgba(245,158,11,.12);--ag:rgba(245,158,11,.25);
 --grn:#10b981;--gd:rgba(16,185,129,.12);--gg:rgba(16,185,129,.25);
 --cy:#06b6d4;--cd:rgba(6,182,212,.12);--pu:#8b5cf6;--pd:rgba(139,92,246,.12);
 --r:8px;--rl:12px;--rx:16px;
 --ft:'Inter',system-ui,-apple-system,sans-serif;
 --mo:'SF Mono','Fira Code',ui-monospace,monospace}
html[data-theme=light]{
 color-scheme:light;--w:15,23,42;
 --canvas:#f4f6fb;--surface:#ffffff;--s2:#f1f5f9;--s3:#e2e8f0;
 --tx:#0f172a;--tx2:#475569;--tx3:#64748b;
 --ac:#2563eb;--ac-d:#1d4ed8;--ac-g:rgba(37,99,235,.2);
 --red:#dc2626;--amb:#d97706;--grn:#059669;--pu:#7c3aed;
 --t-red:#b91c1c;--t-grn:#047857;--t-blu:#1d4ed8;--t-amb:#b45309;--t-amb2:#92400e;--t-pu:#6d28d9;--t-cy:#0e7490;--t-blu2:#2563eb;
 --hdr-bg:rgba(255,255,255,.82);--hdr-bg2:rgba(255,255,255,.97)}
html[data-theme=light] body{background-image:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(59,130,246,.08),transparent)}
html[data-theme=light] .cd,html[data-theme=light] .kp,html[data-theme=light] .rp{box-shadow:0 1px 3px rgba(15,23,42,.06)}
html[data-theme=light] #analytics_overlay{background:rgba(15,23,42,.35)!important}
html[data-theme=light] #analytics_overlay>div{box-shadow:0 20px 60px rgba(15,23,42,.18)!important}
.tgl{padding:6px 12px;font-size:13px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--ft);background:var(--canvas);color:var(--tx);line-height:1.6;min-height:100vh;
 background-image:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(59,130,246,.07),transparent),
 radial-gradient(ellipse 50% 40% at 80% 90%,rgba(139,92,246,.05),transparent)}

/* Header */
header{background:var(--hdr-bg);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
 border-bottom:1px solid rgba(var(--w),.06);position:sticky;top:0;z-index:100}
.hdr{max-width:1280px;margin:0 auto;padding:14px 28px;display:flex;justify-content:space-between;align-items:center}
.logo{display:flex;align-items:center;gap:12px;font-size:17px;font-weight:700;letter-spacing:-.3px}
.logo-i{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--ac),var(--pu));
 display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 0 16px var(--ac-g)}
.bdg{font-size:11px;padding:4px 14px;border-radius:20px;background:var(--glass);border:1px solid var(--gb);
 color:var(--tx2);font-weight:600;display:inline-flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.dot.on{background:var(--grn);box-shadow:0 0 6px var(--gg)}
.dot.off{background:var(--amb);box-shadow:0 0 6px var(--ag)}

main{max-width:1280px;margin:0 auto;padding:24px 28px 60px}

/* Cards */
.cd{background:var(--surface);border:1px solid var(--gb);border-radius:var(--rl);padding:20px 24px;margin-bottom:14px;transition:border-color .2s}
.cd:hover{border-color:rgba(var(--w),.12)}
.cd-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.cd-h h3{font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:.5px}
.sb{padding:3px 10px;border-radius:6px;font-size:10px;font-weight:700;letter-spacing:.4px}
.sb.llm{background:var(--pd);color:var(--t-pu);border:1px solid rgba(139,92,246,.2)}
.sb.tool{background:var(--cd);color:var(--t-cy);border:1px solid rgba(6,182,212,.2)}
.sb.rag{background:var(--ad);color:var(--t-amb);border:1px solid rgba(245,158,11,.2)}
.mt{font-size:11px;color:var(--tx3);font-weight:500;display:flex;gap:14px;font-variant-numeric:tabular-nums}

/* Forms */
textarea{width:100%;font:14px/1.6 var(--ft);padding:12px 16px;background:var(--s2);
 border:1px solid rgba(var(--w),.08);border-radius:var(--r);color:var(--tx);resize:vertical;transition:border-color .2s,box-shadow .2s}
textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px var(--ac-g)}
textarea::placeholder{color:var(--tx3)}
select{font:13px var(--ft);padding:8px 12px;background:var(--s2);border:1px solid rgba(var(--w),.08);
 border-radius:var(--r);color:var(--tx);cursor:pointer}
select:focus{outline:none;border-color:var(--ac)}
select option{background:var(--surface);color:var(--tx)}

/* Buttons */
button{font:13px/1 var(--ft);font-weight:600;padding:9px 18px;border-radius:var(--r);
 border:1px solid rgba(var(--w),.1);background:var(--glass);color:var(--tx);cursor:pointer;
 transition:all .15s;display:inline-flex;align-items:center;gap:6px}
button:hover{background:var(--gh);transform:translateY(-1px)}
button:active{transform:translateY(0)}
button:disabled{opacity:.35;cursor:default;transform:none}
.ba{background:var(--ac);color:#fff;border-color:var(--ac);box-shadow:0 0 14px var(--ac-g)}
.ba:hover{background:var(--ac-d)}
.bg{background:var(--grn);color:#fff;border-color:var(--grn);box-shadow:0 0 10px var(--gg)}.bg:hover{background:#059669}
.br{background:rgba(239,68,68,.15);color:var(--red);border-color:rgba(239,68,68,.3)}.br:hover{background:rgba(239,68,68,.25)}
.bw{background:rgba(245,158,11,.15);color:var(--amb);border-color:rgba(245,158,11,.3);box-shadow:0 0 10px var(--ag)}.bw:hover{background:rgba(245,158,11,.25)}

/* Chips */
.ch{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;
 background:var(--glass);border:1px solid var(--gb);color:var(--tx2);gap:4px;margin:2px}
.ch.w{background:var(--rd);border-color:rgba(239,68,68,.2);color:var(--t-red)}
.tH{background:var(--rd);color:var(--red);border:1px solid rgba(239,68,68,.25);font-weight:700}
.tM{background:var(--ad);color:var(--amb);border:1px solid rgba(245,158,11,.25);font-weight:700}
.tL{background:var(--gd);color:var(--grn);border:1px solid rgba(16,185,129,.25);font-weight:700}

/* Tables */
table{border-collapse:collapse;width:100%;font-size:12px;font-variant-numeric:tabular-nums}
th{font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--tx3);font-weight:600;
 padding:10px 12px;border-bottom:1px solid rgba(var(--w),.06);text-align:left}
td{padding:10px 12px;border-bottom:1px solid rgba(var(--w),.04);color:var(--tx2)}
tr:hover td{background:rgba(var(--w),.02)}
.HIGH{color:var(--red);font-weight:700}.MEDIUM{color:var(--amb);font-weight:700}.LOW{color:var(--grn);font-weight:700}

iframe{width:100%;height:520px;border:1px solid var(--gb);border-radius:var(--rl);background:var(--surface)}
.mu{color:var(--tx3);font-size:12px}
pre{white-space:pre-wrap;font:11.5px/1.5 var(--mo);background:var(--s2);
 padding:8px 12px;border-radius:var(--r);border:1px solid rgba(var(--w),.04);color:var(--tx2);margin:4px 0}
.sl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--tx3);margin-bottom:4px}

/* Alerts */
.al{border-radius:var(--r);padding:12px 16px;font-size:13px;margin-bottom:12px;display:flex;align-items:flex-start;gap:10px}
.al.aw{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.2);color:var(--t-amb)}
.al.ai{background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.2);color:var(--t-blu)}
.al.ae{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);color:var(--t-red)}
.al.ao{background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.2);color:var(--t-grn)}

/* Scenario bar */
.scb{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.scb .lb{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--tx3);font-weight:600;margin-right:4px}
.scn{font-size:12px;padding:6px 16px;border-radius:20px;background:var(--s2);border:1px solid rgba(var(--w),.06);color:var(--tx2)}
.scn:hover{background:var(--ac);color:#fff;border-color:var(--ac)}
.ir{display:flex;gap:14px;align-items:center;margin-top:14px;flex-wrap:wrap}
.ir label{font-size:12px;font-weight:600;color:var(--tx2);display:flex;align-items:center;gap:8px}
.ir select{height:38px}
.ir .ba{height:38px}

/* KPI Grid */
.kg{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.kp{background:var(--surface);border:1px solid var(--gb);border-radius:var(--rl);padding:14px 16px;text-align:center;
 position:relative;overflow:hidden;transition:border-color .2s}
.kp:hover{border-color:rgba(var(--w),.14)}
.kp::before{content:'';position:absolute;inset:0;opacity:0;transition:opacity .25s}.kp:hover::before{opacity:1}
.kp.hero{grid-column:span 2}
.kp .v{font-size:26px;font-weight:800;line-height:1.1;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.kp .l{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--tx3);font-weight:600;margin-top:3px}
.kp.kh .v{color:var(--red)}.kp.kh::before{background:radial-gradient(ellipse at center,var(--rd),transparent)}
.kp.km .v{color:var(--amb)}.kp.km::before{background:radial-gradient(ellipse at center,var(--ad),transparent)}
.kp.kl .v{color:var(--grn)}.kp.kl::before{background:radial-gradient(ellipse at center,var(--gd),transparent)}
.kp.kn .v{color:var(--ac)}

/* Timeline */
.tl{position:relative;padding-left:34px}
.tl::before{content:'';position:absolute;left:12px;top:10px;bottom:10px;width:2px;
 background:linear-gradient(to bottom,var(--ac),var(--pu),rgba(var(--w),.06))}
.ti{position:relative;margin-bottom:14px}
.td{position:absolute;left:-34px;top:22px;width:22px;height:22px;border-radius:50%;
 display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;
 z-index:2;border:2px solid var(--surface)}
.td.ok{background:var(--grn);color:#fff;box-shadow:0 0 8px var(--gg)}
.td.go{background:var(--ac);color:#fff;box-shadow:0 0 8px var(--ac-g);animation:pu 1.5s infinite}
.td.wa{background:var(--amb);color:#fff;box-shadow:0 0 8px var(--ag)}
@keyframes pu{0%,100%{opacity:1}50%{opacity:.5}}

/* Spinner */
.sp{width:18px;height:18px;border:2.5px solid rgba(var(--w),.1);border-top-color:var(--ac);
 border-radius:50%;animation:sn .7s linear infinite;display:inline-block}
@keyframes sn{to{transform:rotate(360deg)}}

/* Diff */
.df{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:3px 10px;
 border-radius:20px;letter-spacing:.3px;margin:2px}
.df.da{background:rgba(16,185,129,.12);color:var(--t-grn);border:1px solid rgba(16,185,129,.2)}
.df.dr{background:rgba(239,68,68,.12);color:var(--t-red);border:1px solid rgba(239,68,68,.2)}
.df.ds{background:var(--glass);color:var(--tx3);border:1px solid var(--gb)}

/* History */
.hd{position:relative;margin:24px 0 16px;border:none;border-top:1px dashed rgba(245,158,11,.3)}
.hl{position:absolute;top:-10px;left:20px;background:var(--canvas);padding:0 12px;
 font-size:11px;font-weight:700;color:var(--amb);letter-spacing:.6px;text-transform:uppercase}
.ht{font-size:12px;color:var(--ac);cursor:pointer;font-weight:600;background:none;border:none;
 padding:4px 0;display:inline-flex;align-items:center;gap:5px}
.ht:hover{color:var(--t-blu2);text-decoration:underline}
.hb{overflow:hidden;transition:max-height .35s ease,opacity .25s;border-radius:var(--r);margin:8px 0 12px}
.hb.shut{max-height:0;opacity:0;pointer-events:none}.hb.op{max-height:8000px;opacity:1}
.hb .cd{opacity:.7;border-style:dashed}

/* Review panel */
.rp{background:var(--surface);border:1px solid rgba(59,130,246,.3);border-radius:var(--rx);
 padding:28px;margin-bottom:16px;box-shadow:0 0 40px rgba(59,130,246,.06)}
.rp h3{font-size:15px;font-weight:700;margin-bottom:18px;display:flex;align-items:center;gap:10px}
.ra{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;padding-top:18px;border-top:1px solid rgba(var(--w),.06)}
.rf{margin-top:18px;padding:16px;background:var(--s2);border-radius:var(--rl);border:1px solid rgba(var(--w),.06)}
.rf label{font-size:11px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:8px}
.rf textarea{height:72px;font-size:13px;background:var(--surface);border-color:rgba(var(--w),.06)}

/* Outcome */
.oc{border-left:3px solid;padding:16px 20px;display:flex;align-items:center;gap:10px}
.oc.oo{border-left-color:var(--grn);background:rgba(16,185,129,.04)}
.oc.ow{border-left-color:var(--amb);background:rgba(245,158,11,.04)}
.oc.oe{border-left-color:var(--red);background:rgba(239,68,68,.04)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:4px 12px;border-radius:20px}
.pill.pb{background:rgba(59,130,246,.12);color:var(--t-blu);border:1px solid rgba(59,130,246,.2)}

@media(max-width:768px){
 .hdr{padding:12px 16px}main{padding:16px}
 .kg{grid-template-columns:repeat(2,1fr)}.kp.hero{grid-column:span 2}
 .ra{flex-direction:column}.ra button{width:100%;justify-content:center}
 .tl{padding-left:26px}.tl::before{left:8px}.td{left:-26px;width:18px;height:18px;font-size:9px}}
@supports not(backdrop-filter:blur(1px)){header{background:var(--hdr-bg2)}}
</style></head><body>
<header><div class="hdr">
 <div class="logo"><span class="logo-i">&#x26a1;</span>Supply Chain Disruption Monitor</div>
 <div style="display:flex;align-items:center;gap:12px">
 <button id="tg" class="tgl" onclick="toggleTheme()" title="Switch between light and dark mode" aria-label="Switch between light and dark mode"></button>
  <button onclick="showAnalytics()" style="background:rgba(var(--w),.08);border:1px solid rgba(var(--w),.12);color:var(--tx2);font:12px var(--ft);padding:6px 14px;border-radius:var(--r);cursor:pointer;backdrop-filter:blur(8px)">&#x1f4ca; Analytics</button>
  <span class="bdg"><span class="dot on" id="sd"></span><span id="lt"></span></span>
 </div>
</div></header>
<main>
 <div id="mb" class="al aw" style="display:none">
  <span>&#x26a0;</span>
  <div>Running with <b>offline mock LLM</b>. Set <code style="background:var(--s2);padding:1px 6px;border-radius:4px">QWEN_API_KEY</code> in .env for Qwen3-8B.</div>
 </div>
 <div class="cd" style="border-color:rgba(59,130,246,.15)">
  <div class="cd-h"><h3>&#x1f4f0; Input Article</h3></div>
  <div class="scb"><span class="lb">Scenarios</span><span id="sc"></span></div>
  <textarea id="art" rows="4" placeholder="Paste a news article about a potential supply chain disruption..."></textarea>
  <div class="ir">
   <label>Grocer <select id="fc"></select></label>
   <button class="ba" id="rn" onclick="go()">&#x25b6;&#xfe0f; Run Analysis</button>
   <span id="rm" class="mu"></span>
  </div>
 </div>
 <div id="kp"></div>
 <div id="st"></div>
 <div id="rv"></div>
 <div id="ot"></div>
<div id="analytics_overlay" style="display:none;position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);overflow:auto;padding:40px 20px" onclick="if(event.target===this)closeAnalytics()">
 <div style="max-width:720px;margin:0 auto;background:var(--surface);border:1px solid rgba(var(--w),.08);border-radius:16px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.5)">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
   <h2 style="font-size:18px;color:var(--tx);font-weight:700">&#x1f4ca; Retry Analytics</h2>
   <button onclick="closeAnalytics()" style="background:none;border:none;color:var(--tx2);font-size:20px;cursor:pointer">&times;</button>
  </div>
  <div id="analytics_body"><div class="sp" style="margin:40px auto"></div></div>
 </div>
</div>
</main>
<script>
const $=id=>document.getElementById(id);
/* Light / dark mode: saved choice, else the system setting (see the script in <head>) */
function curTheme(){return document.documentElement.getAttribute('data-theme')==='light'?'light':'dark'}
function paintTheme(){const t=curTheme(),b=$('tg');
 if(b)b.innerHTML=t==='light'?'&#x1f319; Dark':'&#x2600;&#xfe0f; Light';
 document.querySelectorAll('iframe').forEach(f=>{try{f.contentWindow.postMessage({theme:t},'*')}catch(e){}})}
function toggleTheme(){const t=curTheme()==='light'?'dark':'light';
 document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('theme',t)}catch(e){}paintTheme()}
window.addEventListener('DOMContentLoaded',paintTheme);paintTheme();
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const C=(a,c='')=>(a&&a.length?a.map(x=>`<span class="ch ${c}">${E(x)}</span>`).join(' '):'<span class="mu">none</span>');
let J=null,T=null,SC=[],RS=false,KG=null,KGT=null,LASTV=null;

async function init(){
 const s=await(await fetch('/api/status')).json();
 $('lt').textContent=s.llm;
 if(s.mock){$('mb').style.display='flex';$('sd').className='dot off'}
 const d=await(await fetch('/api/scenarios')).json();SC=d.scenarios;
 $('fc').innerHTML=d.grocers.map(g=>`<option>${E(g)}</option>`).join('');
 $('sc').innerHTML=SC.map((s,i)=>`<button class="scn" onclick="pk(${i})">${E(s.title)}</button>`).join('');
 await refreshKg(false);
}

/* Knowledge-graph impact: the server computes this itself in the background (see _ensure_kg_comparison
   in app.py) when it starts with ground-entities on. Poll while it's running and soft-refresh any
   already-rendered step cards once it lands, without disturbing an in-progress analysis job. */
async function refreshKg(force=true){
 if(force){try{await fetch('/api/kg-impact/refresh',{method:'POST'})}catch(e){}}
 try{KG=await(await fetch('/api/kg-impact')).json()}catch(e){KG={available:false,status:'error',error:String(e)}}
 if(KG.status==='running'){
  clearInterval(KGT);
  KGT=setInterval(async()=>{
   try{KG=await(await fetch('/api/kg-impact')).json()}catch(e){return}
   if(KG.status!=='running'){clearInterval(KGT);if(LASTV)render(LASTV)}
  },8000);
 }else if(LASTV){render(LASTV)}
}
function pk(i){$('art').value=SC[i].article;$('fc').value=SC[i].focal}

async function go(){
 const a=$('art').value.trim();
 if(!a){$('rm').textContent='Pick a scenario or paste an article.';return}
 $('rm').textContent='';$('rn').disabled=true;
 $('st').innerHTML='';$('rv').innerHTML='';$('ot').innerHTML='';$('kp').innerHTML='';RS=false;
 const r=await fetch('/api/run',{method:'POST',body:JSON.stringify({article:a,focal:$('fc').value})});
 const j=await r.json();
 if(j.error){$('rm').textContent=j.error;$('rn').disabled=false;return}
 J=j.job_id;poll();
}
function poll(){
 clearInterval(T);
 T=setInterval(async()=>{
  const v=await(await fetch('/api/job/'+J)).json();render(v);
  if(v.status!=='running'){clearInterval(T);if(v.status!=='awaiting_review')$('rn').disabled=false}
 },500);
}

/* Knowledge-graph grounding impact. The server computes this itself, live, against whichever LLM
   it's actually running (see _ensure_kg_comparison in app.py) when started with ground-entities on;
   /api/kg-impact serves the result and refreshKg() polls while a (re)compute is in flight.
   kgPanel() is reused under Retrieval, Risk Scoring and the Network Diagram, each with the
   metrics relevant to that step. */
function kgRecomputeBtn(){
 return `<button onclick="refreshKg()" style="font-size:10px;padding:3px 9px;margin-left:8px">&#x1f504; Recompute live</button>`;
}
function kgEmptyHtml(){
 if(KG&&KG.status==='running')return `<div class="mu" style="margin-top:8px"><span class="sp" style="width:11px;height:11px;border-width:2px;vertical-align:middle;margin-right:6px"></span>Computing a live baseline-vs-grounding comparison with ${E(KG.current_llm||'the active LLM')} in the background (several minutes, runs once) &mdash; this panel updates automatically when it's done.</div>`;
 if(KG&&KG.status==='error')return `<div class="mu" style="margin-top:8px;color:var(--red)">Live comparison failed: ${E(KG.error||'unknown error')}. ${kgRecomputeBtn()}</div>`;
 return `<div class="mu" style="margin-top:8px">Start the server with <code style="background:var(--s2);padding:1px 6px;border-radius:4px">RAG=1 python app.py</code> to compute this live against the active LLM, or run <code style="background:var(--s2);padding:1px 6px;border-radius:4px">python cli.py eval --ground-entities</code> by hand. ${kgRecomputeBtn()}</div>`;
}
function kgPanel(title,rows,note){
 if(!KG||!KG.available)return kgEmptyHtml();
 const recomputing=KG.status==='running'?`<div class="mu" style="margin-top:6px"><span class="sp" style="width:10px;height:10px;border-width:2px;vertical-align:middle;margin-right:5px"></span>Recomputing live with ${E(KG.current_llm||'the active LLM')}&hellip; numbers below are from the last completed run (${E(KG.llm)}).</div>`:'';
 return `<div style="margin-top:12px;padding:12px 14px;background:var(--s2);border-radius:var(--r);border:1px solid rgba(var(--w),.06)">
  <div class="sl" style="margin-bottom:8px;display:flex;align-items:center;flex-wrap:wrap">&#x1f578;&#xfe0f; ${title} &mdash; ${KG.articles}-article eval set (${E(KG.llm)})${kgRecomputeBtn()}</div>
  <div style="overflow-x:auto"><table><tr><th></th><th>Without RAG</th><th>With KG Grounding</th></tr>
  ${rows.map(([l,a,b])=>`<tr><td>${l}</td><td>${a}</td><td style="color:var(--grn);font-weight:700">${b}</td></tr>`).join('')}
  </table></div>
  ${note?`<div class="mu" style="margin-top:6px">${note}</div>`:''}
  ${recomputing}
 </div>`;
}
function kgImpactHtml(){
 if(!KG||!KG.available)return kgPanel('Knowledge Graph Impact',[]);
 const wo=KG.without_rag,w=KG.with_kg_grounding;
 const rows=[['Extraction F1',wo.extraction_f1,w.extraction_f1],
  ['Exact extraction',wo.exact_extraction,w.exact_extraction],
  ['Exposure detected',wo.exposure_detected,w.exposure_detected],
  ['False positives handled',wo.false_positives_handled,w.false_positives_handled]];
 if('entity_grounding_precision' in w)rows.push(['Company name match P / R','n/a &mdash; no KG check',
  `${w.entity_grounding_precision} / ${w.entity_grounding_recall}`]);
 return kgPanel('Knowledge Graph Impact',rows,'Without grounding the model has no way to verify a company name against the supply network; with it, every named company is checked against the graph before extraction is trusted.');
}
function kgRiskHtml(){
 if(!KG||!KG.available)return kgPanel('RAG Impact on Risk Scoring',[]);
 const wo=KG.without_rag,w=KG.with_kg_grounding;
 const rows=[['Top Tier-1 supplier match',wo.top_supplier_match,w.top_supplier_match],
  ['Top HIGH-risk supplier match',wo.top_high_supplier_match,w.top_high_supplier_match],
  ['Disrupted-supplier count match',wo.disrupted_count_match,w.disrupted_count_match]];
 return kgPanel('RAG Impact on Risk Scoring',rows,'Risk scores themselves are computed deterministically from the extracted criteria (no LLM in this step); grounding helps indirectly, by giving the Monitoring step verified company/industry/country names so the risk engine starts from more accurate inputs.');
}
function kgNetworkHtml(){
 if(!KG||!KG.available)return kgPanel('RAG Impact on Network Diagram',[]);
 const wo=KG.without_rag,w=KG.with_kg_grounding;
 const rows=[['Disrupted-supplier count match',wo.disrupted_count_match,w.disrupted_count_match],
  ['Exposure detected',wo.exposure_detected,w.exposure_detected]];
 return kgPanel('RAG Impact on Network Diagram',rows,'The diagram only draws what the knowledge-graph traversal (BFS) found; its accuracy is capped by how correctly Monitoring extracted countries/industries/companies, which grounding helps with.');
}

/* Credibility verdict badge (shared by the step card and the review panel) */
const CRV={genuine:['&#x2705; Genuine','background:var(--gd);color:var(--t-grn);border-color:rgba(16,185,129,.2)'],
 suspicious:['&#x26a0;&#xfe0f; Suspicious','background:rgba(245,158,11,.12);color:var(--t-amb2);border-color:rgba(245,158,11,.25)'],
 likely_fake:['&#x1f6a9; Likely Fake','background:var(--rd);color:var(--t-red);border-color:rgba(239,68,68,.2)']};
function credBadge(c){const v=CRV[c.verdict]||CRV.suspicious;
 return `<span class="ch" style="${v[1]};font-weight:700">${v[0]}</span> <span class="mu">suspicion score ${c.score}</span>`}
const CST={supported:['&#x2705;','var(--grn)'],unverifiable:['&#x2753;','var(--amb)'],contradicted:['&#x274c;','var(--red)']};
function credHtml(c){
 return `<div style="margin-bottom:10px">${credBadge(c)}</div>
  ${c.reasons.length?`<ul style="padding-left:18px;font-size:13px;color:var(--tx2);margin-bottom:10px">${c.reasons.map(r=>`<li style="margin-bottom:3px">${E(r)}</li>`).join('')}</ul>`:''}
  <details><summary class="mu" style="cursor:pointer;font-size:11px">Show ${c.checks.length} extracted claim${c.checks.length===1?'':'s'} and the evidence for each</summary>
  <div style="overflow-x:auto;margin-top:6px"><table><tr><th>Claim</th><th>Status</th><th>Evidence</th></tr>
  ${c.checks.map(k=>{const t=CST[k.status]||CST.unverifiable;return `<tr><td style="color:var(--tx)">${E(k.claim)}</td>
   <td style="color:${t[1]};white-space:nowrap">${t[0]} ${k.status}</td><td style="font-size:12px;color:var(--tx2)">${E((k.reasons||[]).join('; '))}</td></tr>`}).join('')}</table></div></details>
  <div class="mu" style="margin-top:8px">No live fact-checking: the verdict rests on the supplier network, internal consistency and warning signs. A person makes the final call.</div>`}

const ALT_HOW=`<details style="margin-bottom:10px"><summary class="mu" style="cursor:pointer;font-size:11px">How candidates are chosen</summary>
 <ol class="mu" style="margin:6px 0 0 18px;line-height:1.6">
  <li><b>Same industry</b> as the supplier being replaced.</li>
  <li><b>Outside the disruption:</b> its country, industry and name do not match what the article says is hit.</li>
  <li><b>Clean upstream:</b> its own suppliers (Tier-2 to Tier-4 once it becomes your Tier-1) include no disrupted company. Those pass as <i>clear</i>.</li>
  <li><b>Exposure</b> (for candidates that are not clear): each disrupted upstream supplier adds 1/(hops+1), so nearer ones count more.</li>
  <li><b>Ranking:</b> lowest exposure first, then smaller upstream network (less can go wrong), then name.</li>
  <li><b>Fallback:</b> exposed candidates are shown only when no clear candidate exists, and are marked not clear. The top 5 are listed.</li>
  <li>Only industry is matched: check product, capacity, price and lead time before switching.</li></ol></details>`;

/* Replacement candidates for one supplier (used in the review panel and the final card) */
function altTable(a){
 return `<div style="overflow-x:auto"><table><tr><th>Candidate</th><th>Country</th><th>Clear</th><th>Disrupted upstream</th><th title="0 = no disrupted supplier upstream; each one adds 1/(hops+1)">Exposure</th><th>Upstream size</th></tr>
  ${a.alternatives.length?a.alternatives.map(c=>`<tr><td style="color:var(--tx);font-weight:600">${E(c.name)}${c.already_supplier?' <span class="mu">(already a supplier)</span>':''}</td><td>${E(c.country)}</td>
  <td>${c.verified_clear?'<span style="color:var(--grn)">&#x2705;</span>':'<span style="color:var(--red)">&#x274c;</span>'}</td>
  <td>${c.disrupted_upstream}</td><td>${c.exposure_score}</td><td>${c.upstream_size}</td></tr>`).join(''):'<tr><td colspan="6" class="mu">No candidate outside the disrupted area in the same industry.</td></tr>'}</table></div>`}

/* Step body */
function bd(n,d){
 if(n==='credibility')return credHtml(d);
 if(n==='flagged_fake')return `<div style="font-size:14px;color:var(--tx2)">${E(d.message)}</div>`;
 if(n==='preview_alternatives')return '';
 if(n==='retrieve'){
  const fn=d.fake_news;
  const fnBadge=fn?`<span class="ch" style="${fn.verdict==='fake'?'background:var(--rd);color:var(--t-red);border-color:rgba(239,68,68,.2)':'background:var(--gd);color:var(--t-grn);border-color:rgba(16,185,129,.2)'};font-weight:700">
    ${fn.verdict==='fake'?'&#x26a0;&#xfe0f; Likely Fake / False Positive':'&#x2705; Likely Genuine Disruption'}</span>
   <span class="mu">${fn.false_positive_votes}/${fn.total_votes} nearest historical examples were false positives &middot; closest match ${E(fn.top_match)} (score ${fn.top_score})</span>`
   :'<span class="mu">RAG examples are off &mdash; no fake-news check available for this run.</span>';
  return `<div style="margin-bottom:10px"><span class="sl">Fake News Check</span><div style="margin-top:4px">${fnBadge}</div></div>
   ${d.examples.length?`<details style="margin-bottom:6px"><summary class="mu" style="cursor:pointer;font-size:11px">Show matched examples</summary>
    <div style="margin-top:6px">${C(d.examples.map(e=>e.id+' ['+e.kind+'] ('+e.score+')'))}</div></details>`:''}
   ${d.grounding?`<div><span class="sl">Companies Named</span> ${C(d.entities)}</div>${kgImpactHtml()}`:''}`;
 }
 if(n==='monitoring')return `<div style="margin-bottom:10px;display:flex;gap:8px;flex-wrap:wrap">
  <span class="ch" style="${d.is_disruption?'background:var(--rd);color:var(--t-red);border-color:rgba(239,68,68,.2)':'background:var(--gd);color:var(--t-grn);border-color:rgba(16,185,129,.2)'};font-weight:700">
  ${d.is_disruption?'&#x1f6a8; Disruption':'&#x2705; Clear'}</span>
  <span class="ch">${E(d.disruption_type)}</span></div>
  <div style="margin-bottom:10px;font-size:14px">${E(d.summary)}</div>
  <div style="margin-bottom:6px"><span class="sl">Countries</span> ${C(d.countries)}</div>
  <div style="margin-bottom:6px"><span class="sl">Industries</span> ${C(d.industries)}</div>
  <div style="margin-bottom:6px"><span class="sl">Companies</span> ${C(d.companies)}</div>
  <details style="margin-top:8px"><summary class="mu" style="cursor:pointer;font-size:11px">Show reasoning</summary>
  <div style="margin-top:6px;font-size:12px;color:var(--tx3);line-height:1.5">${E(d.reasoning)}</div></details>`;
 if(n==='kg_query')return `<div style="margin-bottom:10px"><span class="sl">Matched</span> ${C([...d.criteria.countries,...d.criteria.industries,...d.criteria.companies])}</div>
  ${d.unresolved.length?`<div style="margin-bottom:8px"><span class="sl">Not in Graph</span> ${C(d.unresolved,'w')}</div>`:''}
  ${d.sample_chains.length?`<div style="margin-top:8px"><span class="sl">Sample Chains</span>${d.sample_chains.map(c=>`<pre>${E(c.join('  \u2190  '))}</pre>`).join('')}</div>`:''}`;
 if(n==='risk')return `<div style="overflow-x:auto"><table><tr><th>Supplier</th><th>Industry</th><th>Score</th><th>Level</th>
  <th>Breadth</th><th>Dep.</th><th>Crit.</th><th>Centr.</th><th>Depth</th><th>Why</th></tr>
  ${d.top_suppliers.map(s=>`<tr><td style="color:var(--tx);font-weight:600">${E(s.name)}</td><td>${E(s.industry)}</td>
  <td style="font-weight:700;color:var(--tx)">${s.risk_score}</td>
  <td><span class="ch t${s.risk_level[0]}">${s.risk_level}</span></td>
  <td>${s.components.exposure_breadth}</td><td>${s.components.dependency_ratio}</td>
  <td>${s.components.downstream_criticality}</td><td>${s.components.tier1_centrality}</td>
  <td>${s.components.exposure_depth}</td>
  <td style="font-size:11px;color:var(--tx2);max-width:260px">${E(s.reasoning||'')}</td></tr>`).join('')}</table></div>
  <div class="mu" style="margin-top:8px">HIGH &ge; ${d.thresholds.HIGH} &middot; MEDIUM &ge; ${d.thresholds.MEDIUM}</div>
  <div class="mu" style="margin-top:4px">&#x1f4a1; See the network diagram below for a visual reasoning panel with product flow paths.</div>
  ${kgRiskHtml()}`;
 if(n==='visualizer'){
  /* Build a visible reasoning panel below the diagram using risk data from the previous step */
  const riskStep=LASTV&&LASTV.steps?LASTV.steps.filter(s=>s.node==='risk').pop():null;
  const kgStep=LASTV&&LASTV.steps?LASTV.steps.filter(s=>s.node==='kg_query').pop():null;
  let reasonPanel='';
  if(riskStep&&riskStep.data.top_suppliers&&riskStep.data.top_suppliers.length){
   const sups=riskStep.data.top_suppliers;
   reasonPanel=`<div style="margin-top:14px;padding:16px;background:var(--s2);border-radius:var(--r);border:1px solid rgba(var(--w),.06)">
    <div class="sl" style="margin-bottom:10px">&#x1f4a1; Why are these suppliers flagged?</div>
    ${sups.map(s=>`<div style="display:flex;gap:10px;align-items:flex-start;margin-bottom:8px;padding:8px 12px;background:var(--surface);border-radius:6px;border:1px solid rgba(var(--w),.04)">
     <span class="ch t${s.risk_level[0]}" style="flex-shrink:0;margin-top:2px">${s.risk_level}</span>
     <div><span style="color:var(--tx);font-weight:600;font-size:13px">${E(s.name)}</span>
      <span class="mu"> (${E(s.industry)}, ${E(s.country)})</span>
      <span class="mu"> — supplies ${E(s.product_supplied||'goods')}</span>
      <div style="font-size:12px;color:var(--tx2);margin-top:3px">${E(s.reasoning||'moderate exposure across all factors')}</div>
     </div>
     <span style="flex-shrink:0;font-weight:700;color:var(--tx);font-size:13px;margin-left:auto">${s.risk_score}</span>
    </div>`).join('')}
   </div>`;
  }
  let chainPanel='';
  if(kgStep&&kgStep.data.sample_chains&&kgStep.data.sample_chains.length){
   chainPanel=`<div style="margin-top:10px;padding:16px;background:var(--s2);border-radius:var(--r);border:1px solid rgba(var(--w),.06)">
    <div class="sl" style="margin-bottom:8px">&#x1f517; Supply Chain Paths (product flow)</div>
    ${kgStep.data.sample_chains.map(c=>`<pre style="margin:4px 0;font-size:11px">${E(c.join('  ←  '))}</pre>`).join('')}
    <div class="mu" style="margin-top:6px">Each arrow shows what product flows between connected suppliers. Disrupted suppliers break these links.</div>
   </div>`;
  }
  return `<iframe src="/api/network/${J}"></iframe>${reasonPanel}${chainPanel}${kgNetworkHtml()}`;
 }
 if(n==='self_critique'){
  const ss=d.suggestions||[],cf=d.confidence||'';
  return ss.length?`<div style="margin-bottom:6px"><span class="ch ${cf==='high'?'tH':'tM'}">${cf} confidence</span></div>
  <ul style="padding-left:18px;font-size:13px;color:var(--tx2)">${ss.map(s=>`<li style="margin-bottom:4px">${E(s)}</li>`).join('')}</ul>`
  :`<div class="mu">No suggestions — extraction looks clean.</div>`}
 if(n==='csco')return `${d.rag_enhanced?'<div style="margin-bottom:8px"><span class="ch" style="background:rgba(96,165,250,.12);color:var(--t-blu);border:1px solid rgba(96,165,250,.2);font-weight:700">&#x1f4da; RAG-Enhanced Summary</span> <span class="mu">Context from similar past disruptions and verified entities was provided to the LLM</span></div>':''}
  <div style="font-size:14px;margin-bottom:10px;line-height:1.7">${E(d.executive_summary)}</div>
  <div style="color:var(--tx2);margin-bottom:10px;font-size:13px">${E(d.network_impact)}</div>
  <ul style="padding-left:18px;font-size:13px;color:var(--tx2)">${d.key_recommendations.map(x=>`<li style="margin-bottom:4px">${E(x)}</li>`).join('')}</ul>`;
 if(n==='no_exposure')return `<div style="font-size:14px;color:var(--tx2)">${E(d.message)}</div>`;
 if(n==='alternatives')return d.alternatives.length?ALT_HOW+d.alternatives.map(a=>`<div style="margin-bottom:14px">
  <div style="font-size:14px;margin-bottom:8px"><b>${E(a.supplier.name)}</b>
  <span class="mu">(${E(a.supplier.industry)})</span> &mdash; ${a.candidates_considered} candidates, <b style="color:var(--grn)">${a.clear_count}</b> clear</div>
  ${altTable(a)}</div>`).join('')
  :'<div class="mu">No HIGH-risk suppliers &mdash; no replacements needed.</div>';
 return '';
}

function sType(n){return{monitoring:'llm',csco:'llm',self_critique:'llm',credibility:'llm',retrieve:'rag'}[n]||'tool'}
function sIcon(n){return{retrieve:'&#x1f50d;',monitoring:'&#x1f916;',kg_query:'&#x1f578;',risk:'&#x1f4ca;',
 visualizer:'&#x1f310;',csco:'&#x1f4dd;',self_critique:'&#x1f9e0;',no_exposure:'&#x2705;',alternatives:'&#x1f504;',credibility:'&#x1f575;&#xfe0f;',flagged_fake:'&#x1f6a9;'}[n]||''}
function sTitle(n){return{retrieve:'Retrieval (RAG)',monitoring:'Monitoring Agent',kg_query:'Knowledge Graph Query',
 risk:'Risk Scoring',visualizer:'Network Diagram',csco:'CSCO Summary',self_critique:'AI Self-Critique',no_exposure:'No Exposure',alternatives:'Alternative Sourcing',credibility:'Credibility Check (Fake News)',flagged_fake:'Stopped: Likely Fake'}[n]||n}

function mkStep(s){
 const t=sType(s.node),mt=[];
 if(s.seconds!=null)mt.push(s.seconds+'s');
 if(s.tokens)mt.push(s.tokens+' tok');
 return `<div class="ti"><span class="td ok">&#x2713;</span>
  <div class="cd"><div class="cd-h"><h3>${sIcon(s.node)} ${sTitle(s.node)} <span class="sb ${t}">${t}</span></h3>
  <div class="mt">${mt.map(m=>`<span>${m}</span>`).join('')}</div></div>${bd(s.node,s.data)}</div></div>`;
}

/* KPI bar */
function mkKpi(steps){
 const kg=steps.filter(s=>s.node==='kg_query').pop();
 const rk=steps.filter(s=>s.node==='risk').pop();
 if(!kg)return '';
 const d=kg.data;
 let h=`<div class="kg">
  <div class="kp hero kn"><div class="v">${d.disrupted_count}</div><div class="l">Disrupted Suppliers</div></div>
  <div class="kp"><div class="v" style="color:var(--tx)">${d.per_tier[1]}</div><div class="l">Tier 1</div></div>
  <div class="kp"><div class="v" style="color:var(--tx)">${d.per_tier[2]}</div><div class="l">Tier 2</div></div>
  <div class="kp"><div class="v" style="color:var(--tx)">${d.per_tier[3]}</div><div class="l">Tier 3</div></div>
  <div class="kp"><div class="v" style="color:var(--tx)">${d.per_tier[4]}</div><div class="l">Tier 4</div></div>`;
 if(rk){
  const ts=rk.data.top_suppliers;
  const hc=ts.filter(s=>s.risk_level==='HIGH').length;
  const mc=ts.filter(s=>s.risk_level==='MEDIUM').length;
  const lc=ts.filter(s=>s.risk_level==='LOW').length;
  h+=`<div class="kp kh"><div class="v">${hc}</div><div class="l">High Risk</div></div>
   <div class="kp km"><div class="v">${mc}</div><div class="l">Medium</div></div>
   <div class="kp kl"><div class="v">${lc}</div><div class="l">Low</div></div>`;
 }
 return h+'</div>';
}

/* Split attempts */
function splitA(steps){
 const a=[];let c=[];
 for(const s of steps){
  if(s.node==='human_review'&&s.data.approval==='retry'){c.push(s);a.push(c);c=[]}
  else c.push(s);
 }
 if(c.length)a.push(c);return a;
}

function dfb(o,n,l){
 const os=JSON.stringify(o),ns=JSON.stringify(n);
 if(os===ns)return `<span class="df ds">${l}: no change</span>`;
 return `<span class="df dr">${l}: ${E(os)}</span><span class="df da">${l}: ${E(ns)}</span>`;
}

function mkHist(atts){
 if(atts.length<=1)return '';
 let h='';
 for(let i=0;i<atts.length-1;i++){
  const a=atts[i],rt=a.find(s=>s.node==='human_review'&&s.data.approval==='retry');
  const m=a.find(s=>s.node==='monitoring'),k=a.find(s=>s.node==='kg_query');
  const nm=atts[i+1].find(s=>s.node==='monitoring'),nk=atts[i+1].find(s=>s.node==='kg_query');
  const id='h'+i;
  h+=`<div class="hd"><span class="hl">Analysis #${i+1}</span></div>
   ${rt?`<div class="al aw"><span>&#x1f4ac;</span><div><b>Your feedback:</b> <em>"${E(rt.data.retry_feedback)}"</em></div></div>`:''}
   ${m&&nm?`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">
    ${dfb(m.data.countries,nm.data.countries,'Countries')}
    ${dfb(m.data.industries,nm.data.industries,'Industries')}
    ${dfb(m.data.companies,nm.data.companies,'Companies')}
    ${k&&nk?dfb(k.data.disrupted_count,nk.data.disrupted_count,'Disrupted'):''}
   </div>`:''}
   <button class="ht" onclick="tg('${id}')"><span id="${id}_a">&#x25b6;</span> Show analysis #${i+1} details</button>
   <div id="${id}" class="hb shut"><div class="tl" style="margin-top:12px">
    ${a.filter(s=>s.node!=='human_review'&&s.node!=='preview_alternatives').map(s=>mkStep(s)).join('')}
   </div></div>`;
 }
 return h;
}

function tg(id){
 const e=$(id);if(!e)return;const a=$(id+'_a');
 if(e.classList.contains('shut')){e.classList.remove('shut');e.classList.add('op');a.innerHTML='&#x25bc;'}
 else{e.classList.remove('op');e.classList.add('shut');a.innerHTML='&#x25b6;'}
}

/* Main render */
function render(v){
 LASTV=v;
 const atts=splitA(v.steps), cur=atts[atts.length-1], hasR=atts.length>1;
 $('kp').innerHTML=mkKpi(v.steps);
 let h='';
 if(hasR)h+=mkHist(atts);
 if(hasR)h+=`<div class="hd"><span class="hl" style="color:var(--grn)">&#x2713; Current &mdash; Analysis #${atts.length}</span></div>`;
 h+='<div class="tl">';
 h+=cur.filter(s=>s.node!=='human_review'&&s.node!=='preview_alternatives').map(s=>mkStep(s)).join('');
 if(v.status==='running')h+=`<div class="ti"><span class="td go"><div class="sp" style="width:12px;height:12px;border-width:2px"></div></span>
  <div class="cd" style="text-align:center;padding:28px"><div class="sp"></div><div class="mu" style="margin-top:8px">Analysing...</div></div></div>`;
 h+='</div>';
 $('st').innerHTML=h;
 if(v.status==='awaiting_review'&&!RS){RS=true;showRv(v.review,atts)}
 if(v.status!=='awaiting_review')$('rv').innerHTML='';
 const oc={completed:'oo',no_exposure:'ow',rejected:'ow',flagged_fake:'ow',error:'oe'}[v.status];
 const oi={completed:'&#x2705;',no_exposure:'&#x1f7e1;',rejected:'&#x1f6d1;',flagged_fake:'&#x1f6a9;',error:'&#x274c;'}[v.status]||'';
 const tl=v.trace_url?`<div class="mu" style="margin:8px 0"><a href="${E(v.trace_url)}" target="_blank" rel="noopener" style="color:var(--tx2)">&#x1f50e; View this run in Langfuse</a></div>`:'';
 $('ot').innerHTML=(oc?`<div class="cd oc ${oc}"><span style="font-size:16px">${oi}</span> <b>${v.status.replace('_',' ')}</b> &mdash; ${E(v.error||v.message)}</div>`:'')+tl;
}

const ACT={HIGH:'Replace \u2014 source alternative supplier',MEDIUM:'Increase monitoring',LOW:'Maintain standard operations'};

function showRv(rv,atts){
 const rc=rv.retry_count||0,mx=rv.max_retries||3,ok=rc<mx;
 const pm=atts&&atts.length>1?atts[atts.length-2].find(s=>s.node==='monitoring'):null;
 const cm=atts?atts[atts.length-1].find(s=>s.node==='monitoring'):null;
 let dh='';
 if(pm&&cm)dh=`<div class="al ai"><span>&#x1f4ca;</span><div><b>Changes from previous attempt:</b><br>
  ${dfb(pm.data.countries,cm.data.countries,'Countries')}
  ${dfb(pm.data.industries,cm.data.industries,'Industries')}
  ${dfb(pm.data.companies,cm.data.companies,'Companies')}</div></div>`;
 const sug=rv.ai_suggestions||[],conf=rv.ai_confidence||'';
 const sugHtml=sug.length?`<div class="al ${conf==='high'?'ae':'ai'}" style="flex-direction:column;gap:8px">
  <div style="display:flex;align-items:center;gap:8px"><span>&#x1f9e0;</span>
  <b>AI Self-Critique</b> <span class="pill ${conf==='high'?'pb':'pb'}" style="${conf==='high'?'background:var(--rd);color:var(--t-red);border-color:rgba(239,68,68,.2)':''}">${conf} confidence</span></div>
  <ul style="margin:0;padding-left:18px;font-size:13px">${sug.map(s=>`<li style="margin-bottom:4px;cursor:pointer" onclick="document.getElementById('rfb').value=this.textContent;document.getElementById('rfb').focus()" title="Click to use as feedback">${E(s)}</li>`).join('')}</ul>
  <div class="mu">Click a suggestion to auto-fill the feedback box below.</div></div>`:'';

 const mon=cm?cm.data:null;
 const exHtml=mon?`<details style="margin-bottom:14px"><summary style="cursor:pointer;font-size:12px;font-weight:700;color:var(--tx2)">&#x270f;&#xfe0f; Edit Extraction Directly (skip AI, re-run downstream only)</summary>
  <div style="margin-top:10px;padding:14px;background:var(--s2);border-radius:var(--r);border:1px solid rgba(var(--w),.06)">
  <div style="margin-bottom:8px"><span class="sl">Countries (comma-separated)</span>
   <input id="ex_c" value="${E((mon.countries||[]).join(', '))}" style="width:100%;font:13px var(--ft);padding:8px 12px;background:var(--surface);border:1px solid rgba(var(--w),.08);border-radius:var(--r);color:var(--tx)"></div>
  <div style="margin-bottom:8px"><span class="sl">Industries (comma-separated)</span>
   <input id="ex_i" value="${E((mon.industries||[]).join(', '))}" style="width:100%;font:13px var(--ft);padding:8px 12px;background:var(--surface);border:1px solid rgba(var(--w),.08);border-radius:var(--r);color:var(--tx)"></div>
  <div style="margin-bottom:8px"><span class="sl">Companies (comma-separated)</span>
   <input id="ex_co" value="${E((mon.companies||[]).join(', '))}" style="width:100%;font:13px var(--ft);padding:8px 12px;background:var(--surface);border:1px solid rgba(var(--w),.08);border-radius:var(--r);color:var(--tx)"></div>
  <button class="ba" style="margin-top:8px" onclick='dc("edit_extraction")'>&#x2699;&#xfe0f; Apply &amp; Re-run KG &rarr; Risk &rarr; Summary</button>
  </div></details>`:''

 const cr=rv.credibility;
 const crHtml=cr?`<div class="al ${cr.verdict==='genuine'?'ai':'ae'}" style="flex-direction:column;align-items:flex-start;gap:6px">
  <div><b>&#x1f575;&#xfe0f; Fake-news check</b> &nbsp;${credBadge(cr)}</div>
  ${cr.verdict==='genuine'?'':`<ul style="margin:0;padding-left:18px;font-size:13px">${cr.reasons.slice(0,4).map(r=>`<li>${E(r)}</li>`).join('')}</ul>`}</div>`:'';
 const alts=rv.alternatives||[];
 const altHtml=alts.length?`<div style="margin:14px 0"><div class="sl" style="margin-bottom:6px">&#x1f504; Alternative Suppliers (shown before you approve)</div>
  ${ALT_HOW}
  ${alts.map(a=>{const hi=a.risk_level==='HIGH';return `<details ${hi?'open':''} style="margin-bottom:8px;padding:10px 14px;background:var(--s2);border-radius:var(--r);border:1px solid rgba(var(--w),.06)">
   <summary style="cursor:pointer;font-size:13px"><span class="ch t${a.risk_level[0]}">${a.risk_level}</span> <b style="color:var(--tx)">${E(a.supplier.name)}</b>
    <span class="mu">(${E(a.supplier.industry)}) &mdash; ${a.candidates_considered} candidates, <b style="color:var(--grn)">${a.clear_count}</b> clear${hi?'':' &middot; only used if you change this supplier to HIGH'}</span></summary>
   <div style="margin-top:8px">${altTable(a)}</div></details>`}).join('')}</div>`:'';

 $('rv').innerHTML=`<div class="rp">
  <h3>&#x1f9d1; Human Review ${rc?`<span class="pill pb">Analysis #${rc+1} of ${mx+1}</span>`:''}</h3>
  ${rc?`<div class="al ai"><span>&#x1f504;</span><div>The AI has <b>re-analysed</b> the article using your feedback (${rc} round${rc>1?'s':''} of corrections). Review the updated extraction below.</div></div>`:''}
  ${crHtml}
  ${dh}
  ${sugHtml}
  ${exHtml}
  <div style="margin-bottom:14px">
   <label class="sl" style="margin-bottom:6px;display:block">Executive Summary (editable)</label>
   <textarea id="rs" rows="4">${E(rv.csco.executive_summary)}</textarea>
  </div>
  <div style="overflow-x:auto"><table><tr><th>Supplier</th><th>Score</th><th>Action</th></tr>
  ${rv.actions.map((a,i)=>`<tr><td style="color:var(--tx);font-weight:600">${E(a.name)}</td><td style="font-weight:700">${a.risk_score}</td>
  <td><select id="ra${i}">${['HIGH','MEDIUM','LOW'].map(l=>`<option value="${l}" ${l===a.risk_level?'selected':''}>${l}: ${ACT[l]}</option>`).join('')}</select></td></tr>`).join('')}</table></div>
  ${altHtml}
  <div class="rf">
   <label>&#x1f4ac; Feedback for AI Re-analysis</label>
   <textarea id="rfb" placeholder="Tell the AI what to correct, e.g.: 'Japan is only a buyer, not disrupted. Remove it from countries.'"></textarea>
  </div>
  <div class="ra">
   <button class="bg" onclick='dc("approve")'>&#x2705; Approve</button>
   <button class="ba" onclick='dc("edit")'>&#x270f;&#xfe0f; Approve with Edits</button>
   ${ok?`<button class="bw" onclick='dc("retry")'>&#x1f504; Send Feedback &amp; Re-analyse (${mx-rc} left)</button>`
   :`<button disabled>&#x1f504; No re-analyses left</button>`}
   <button class="br" onclick='dc("reject")'>&#x1f6d1; Discard Analysis</button>
  </div></div>`;
 window._rv=rv;
}

async function dc(d){
 const rv=window._rv,m={job_id:J,decision:d};
 if(d==='edit'){
  m.csco={executive_summary:$('rs').value};
  m.actions=rv.actions.map((a,i)=>{const l=$('ra'+i).value;return{...a,risk_level:l,action:ACT[l]}});
 }
 if(d==='reject')m.reason='Rejected by reviewer.';
 if(d==='edit_extraction'){
  const parse=id=>($(id)?$(id).value:'').split(',').map(s=>s.trim()).filter(Boolean);
  m.monitoring={countries:parse('ex_c'),industries:parse('ex_i'),companies:parse('ex_co')};
 }
 if(d==='retry'){
  const f=($('rfb')?$('rfb').value:'').trim();
  if(!f){$('rfb').style.borderColor='var(--red)';$('rfb').focus();return}
  m.reason=f;
 }
 $('rv').innerHTML=d==='retry'
  ?`<div class="cd" style="text-align:center;padding:28px"><div class="sp"></div><div style="margin-top:10px;font-weight:600;color:var(--amb)">&#x1f504; AI is re-analysing with your feedback...</div></div>`
  :`<div class="cd" style="text-align:center;padding:20px"><div class="sp"></div><div class="mu" style="margin-top:8px">Processing...</div></div>`;
 const r=await fetch('/api/review',{method:'POST',body:JSON.stringify(m)});
 if(!(await r.json()).ok){$('rv').innerHTML=`<div class="al ae"><span>&#x274c;</span><div>Could not submit. Try again.</div></div>`;return}
 RS=false;poll();
}
async function showAnalytics(){
 $('analytics_overlay').style.display='block';
 $('analytics_body').innerHTML='<div class="sp" style="margin:40px auto"></div>';
 try{
  const a=await(await fetch('/api/analytics')).json();
  const pct=v=>(v*100).toFixed(0)+'%';
  $('analytics_body').innerHTML=`
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px">
   <div style="background:var(--s2);border-radius:var(--r);padding:16px;text-align:center">
    <div style="font-size:24px;font-weight:800;color:var(--tx)">${a.total_jobs}</div><div class="mu">Total Jobs</div></div>
   <div style="background:var(--s2);border-radius:var(--r);padding:16px;text-align:center">
    <div style="font-size:24px;font-weight:800;color:var(--amb)">${a.jobs_with_retries}</div><div class="mu">Jobs with Retries</div></div>
   <div style="background:var(--s2);border-radius:var(--r);padding:16px;text-align:center">
    <div style="font-size:24px;font-weight:800;color:var(--cy)">${pct(a.retry_rate)}</div><div class="mu">Retry Rate</div></div>
   <div style="background:var(--s2);border-radius:var(--r);padding:16px;text-align:center">
    <div style="font-size:24px;font-weight:800;color:var(--tx)">${a.avg_retries}</div><div class="mu">Avg Retries</div></div>
   <div style="background:var(--s2);border-radius:var(--r);padding:16px;text-align:center">
    <div style="font-size:24px;font-weight:800;color:var(--pp)">${a.self_critique_used}</div><div class="mu">Self-Critique Runs</div></div>
   <div style="background:var(--s2);border-radius:var(--r);padding:16px;text-align:center">
    <div style="font-size:24px;font-weight:800;color:var(--grn)">${a.edit_extraction_count}</div><div class="mu">Direct Edits</div></div>
  </div>
  <div style="margin-bottom:16px">
   <h3 style="font-size:14px;color:var(--tx);margin-bottom:8px">Outcome Distribution</h3>
   <div style="display:flex;gap:8px;flex-wrap:wrap">
    ${Object.entries(a.outcomes).filter(([,v])=>v>0).map(([k,v])=>`<span class="ch" style="font-size:12px">${k}: <b>${v}</b></span>`).join('')}
   </div>
  </div>
  ${a.recent_feedback.length?`<div>
   <h3 style="font-size:14px;color:var(--tx);margin-bottom:8px">Recent Feedback</h3>
   <div style="max-height:200px;overflow:auto">${a.recent_feedback.map(f=>`<div style="background:var(--s2);border-radius:var(--r);padding:10px 14px;margin-bottom:6px;font-size:13px">
    <span class="mu">Job ${f.job_id} &middot; Retry #${f.retry_count}</span>
    <div style="color:var(--tx);margin-top:2px">"${E(f.feedback)}"</div></div>`).join('')}</div></div>`
   :'<div class="mu">No retry feedback recorded yet. Run some analyses and use the retry feature!</div>'}`;
 }catch(e){$('analytics_body').innerHTML=`<div style="color:var(--red)">Failed to load analytics: ${e.message}</div>`}
}
function closeAnalytics(){$('analytics_overlay').style.display='none'}

init();
</script></body></html>
